name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # Build before typecheck and test, and keep it in that order:
      #   - benchmark/run.ts imports the package through its own exports map, so
      #     the declarations in dist/ have to exist before typecheck can resolve them.
      #   - src/dist.test.ts and the runMps worker-pool tests assert against the
      #     built artifacts (ESM, IIFE global, compat entry) and skip themselves
      #     when dist/ is absent. Without this step they would silently not run.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
