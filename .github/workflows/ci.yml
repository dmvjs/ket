name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # benchmark/run.ts imports the package through its own exports map, so the
      # declarations in dist/ have to exist before typecheck can resolve them.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
