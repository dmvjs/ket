<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Five quantum circuits, and the classical method that is enough for each. Priced live in a browser tab.">
<meta property="og:title" content="Is this quantum circuit actually hard?">
<meta property="og:description" content="Five circuits, five structures, and the classical method that is enough for each.">

<style>
  :root { --bg:#08090c; --text:#e6e9ef; --dim:#5a6472; --red:#e2586e; --green:#7fd66a; --line:#171a22;
          --mono: ui-monospace,SFMono-Regular,Menlo,monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono);
         max-width:1120px; margin:0 auto; padding:9vh 1.5rem 6rem; line-height:1.55;
         -webkit-font-smoothing:antialiased; }

  .mark { font-size:.75rem; color:var(--dim); letter-spacing:.3em; margin-bottom:1.5rem; }
  .plain { font-size:.95rem; max-width:58ch; line-height:1.5; margin-bottom:5vh; }

  .go { min-height:1.6rem; margin-bottom:2.5rem; }
  .go .lbl { font-size:.8rem; color:var(--dim); }
  /* The one claim on this page a reader cannot verify by looking, so it is the
     one line that should not be whispered. */
  .live { font-size:1.05rem; color:var(--green); letter-spacing:-.01em; }
  .stats { font-size:.8rem; color:var(--dim); }
  .spin { display:inline-block; width:.85rem; height:.85rem; vertical-align:-.1rem;
          border:2px solid var(--line); border-top-color:var(--green); border-radius:50%;
          animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spin { animation-duration:3s; } }
  tr.waiting td { color:#2b3240; }
  .expect { color:#3a4250; }
  .surprise { color:var(--red); }

  table { border-collapse:collapse; width:100%; font-size:.76rem; }
  th { text-align:left; font-weight:400; color:var(--dim); padding:0 1.1rem .5rem 0;
       border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:.42rem 1.1rem .42rem 0; vertical-align:baseline; }
  th.n, td.n { text-align:right; }
  tbody tr { border-bottom:1px solid #0f1117; }
  .r { color:var(--red); }
  .g { color:var(--green); }
  .d { color:var(--dim); }
  .what { color:var(--text); }


  nav { margin-top:6vh; padding-top:1.5rem; border-top:1px solid var(--line);
        display:flex; gap:1.5rem; font-size:.76rem; }
  nav a { color:var(--dim); text-decoration:none; }
  nav a:hover { color:var(--text); }
</style>
</head>
<body>

<div class="mark">KET</div>

<p class="plain">
  A quantum result only matters if no ordinary computer can reproduce it.
</p>

<p class="plain" style="color:var(--dim);margin-top:-4vh">
  Nine attacks, each priced against a budget. The cheapest that fits wins.
</p>

<div class="go">
  <span class="lbl" id="lbl">starting ket in your browser&hellip;</span>
</div>

<table>
  <thead>
    <tr>
      <th>circuit</th>
      <th class="n">qubits</th>
      <th class="n">gates</th>
      <th class="n">exact statevector</th>
      <th>cheapest classical method</th>
      <th class="n">peak memory</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<nav>
  <a href="docs.html">reference</a>
  <a href="demo.html">playground</a>
  <a href="https://github.com/kirkelliott/ket">github</a>
  <a href="https://www.npmjs.com/package/@kirkelliott/ket">npm</a>
</nav>

<script src="ket.global.js?v=0453a7c4"></script>
<script>
(function () {
  var spin = document.getElementById('spin')
  var lbl  = document.getElementById('lbl')
  var rows = document.getElementById('rows')
  var C = ket.Circuit
  // Declared once and both used and displayed: every verdict here is relative to
  // it, and a page that hides its budget is asking to be misread.
  var BUDGET = { memoryBytes: 16e9, seconds: 3600, probeChi: 4, restarts: 4 }

  /** Matches humanBytes in hardness.ts: 1000-based, exponent past yottabytes. */
  function bytes(n) {
    if (!isFinite(n)) return '∞'
    var u = ['B','KB','MB','GB','TB','PB','EB','ZB','YB'], i = 0
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++ }
    if (n >= 1000) return (n * 1e24).toExponential(1) + ' B'
    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]
  }
  /**
   * Bytes an exact statevector of n qubits needs, without lying at the top end.
   *
   * `2 ** n * 16` overflows float64 above ~1020 qubits and comes back Infinity,
   * which then renders as ∞ — a fact about IEEE 754, not about the circuit. The
   * number is perfectly finite and perfectly absurd, so it is computed as a
   * decimal exponent and printed as one.
   */
  function svBytes(n) {
    var log10 = n * Math.LN2 / Math.LN10 + Math.log10(16)
    if (log10 < 300) return { text: bytes(Math.pow(2, n) * 16), html: null }
    var e = Math.floor(log10)
    var m = Math.pow(10, log10 - e)
    return { text: m.toFixed(1) + ' × 10^' + e + ' B',
             html: m.toFixed(1) + ' × 10<sup>' + e + '</sup> B' }
  }

  function duration(seconds) {
    var h = seconds / 3600
    if (h < 24) return h.toFixed(1) + ' hours'
    var y = h / 8766
    if (y < 1) return Math.round(h / 24) + ' days'
    if (y < 1000) return Math.round(y).toLocaleString() + ' years'
    return y.toExponential(1) + ' years'
  }

  function prng(s) { return function () { s = (s*1103515245+12345) & 0x7fffffff; return s/0x7fffffff } }
  function lineGraph(n) { var e = []; for (var i = 0; i < n - 1; i++) e.push([i, i + 1]); return e }
  function fill(n, k) { var s = ''; for (var i = 0; i < n; i++) s += (i < k ? '1' : '0'); return s }

  /** Clifford brickwork laid on IBM's real heavy-hex coupling map. */
  function hhClifford(depth, seed, tgates) {
    var edges = ket.heavyHex127(), r = prng(seed), c = new C(127)
    for (var d = 0; d < depth; d++) {
      for (var q = 0; q < 127; q++) { var x = r(); c = x < .34 ? c.h(q) : x < .67 ? c.s(q) : c.x(q) }
      for (var i = d % 2; i < edges.length; i += 2) c = c.cnot(edges[i][0], edges[i][1])
    }
    for (var j = 0; j < tgates; j++) c = c.t(Math.floor(j * 127 / Math.max(1, tgates)))
    return c
  }

  // Each row is a circuit whose cheapest *viable* attack is a different one, paired
  // with a question that attack actually answers — an attack computing amplitudes
  // has not answered an expectation value, and claiming it did is the one way this
  // page could lie. Published and physical shapes wherever possible: circuits we
  // invented ourselves would be the weakest evidence available.
  // Each row's cheapest viable attack is a different one, paired with a question
  // that attack actually answers — an attack computing amplitudes has not answered
  // an expectation value, and claiming it did is the one way this page could lie.
  // Published and physical shapes: circuits we invented would be the weakest
  // evidence available.
  var SHOWCASES = [
    { what: 'GHZ chain', n: 50000, answers: 'distribution', expect: 'mps',
      build: function () {
        var c = new C(50000).h(0)
        for (var i = 0; i < 49999; i++) c = c.cnot(i, i + 1)
        return { c: c, o: {} }
      } },

    { what: 'IBM heavy-hex Trotter, θ=π/2', n: 127, answers: 'distribution', expect: 'clifford',
      build: function () { return { c: ket.trotterIsing({ qubits:127, coupling:ket.heavyHex127(), depth:5, thetaH:Math.PI/2 }), o:{} } } },

    // The sharpest pair on the page: the same lattice, three T gates added, and a
    // different attack takes over. The choice is made per structure, not per family.
    { what: 'the same lattice + 3 T gates', n: 127, answers: 'distribution', expect: 'stabilizer-rank',
      build: function () { return { c: hhClifford(6, 7, 3), o:{} } } },

    { what: 'Sycamore random circuit, depth 6', n: 54, answers: 'amplitude', expect: 'tensor-network',
      build: function () { return { c: ket.rcsCircuit({ rows:6, cols:9, depth:6, seed:1 }), o:{} } } },

    // The row where nothing lands, and it fails on memory rather than the clock:
    // 141 TB against 16 GB is 8,796x, past arguing with. N=33 failed by 6.9x on
    // time, which invites "so give it a day" and answers it with yes.
    { what: "Shor - factor 1003 = 17 × 59", n: 43, answers: 'distribution', expect: null,
      build: function () { return { c: ket.shorCircuit(1003n, 5n), o:{} } } },
  ]

  // A full distribution answers a diagonal expectation. Not the reverse:
  // probabilities carry no phase, so they cannot supply an amplitude.
  function answersIt(a, want) {
    return a.answers === want || (want === 'expectation' && a.answers === 'distribution')
  }
  function cell(row, text, cls) {
    var td = document.createElement('td')
    td.textContent = text
    if (cls) td.className = cls
    row.appendChild(td)
    return td
  }
  function paint() { return new Promise(function (r) { setTimeout(r, 15) }) }

  ;(async function () {
    // Every row is drawn before anything is measured — name, width and the
    // statevector cost are all arithmetic — so the page shows what it is about to
    // do rather than appearing a piece at a time. Each row then spins in place.
    var pending = SHOWCASES.map(function (s) {
      var tr = document.createElement('tr')
      tr.className = 'waiting'
      cell(tr, s.what, 'what')
      cell(tr, s.n.toLocaleString(), 'n d')
      var gatesCell = cell(tr, '', 'n d')
      var sv = svBytes(s.n)
      var svCell = cell(tr, sv.text, 'n r')
      if (sv.html) svCell.innerHTML = sv.html
      var method = cell(tr, '', '')
      method.innerHTML = '<span class="spin"></span> <span class="expect">expecting ' +
        (s.expect === null ? 'nothing to land' : s.expect) + '</span>'
      var needed = cell(tr, '', 'n')
      rows.appendChild(tr)
      return { tr: tr, gates: gatesCell, method: method, needed: needed }
    })

    var total = 0, headline = null
    try {
      for (var i = 0; i < SHOWCASES.length; i++) {
        var s = SHOWCASES[i], row = pending[i]
        lbl.textContent = 'probing ' + ket.ATTACK_NAMES.length + ' attacks against ' +
          s.what + '  (' + (i + 1) + '/' + SHOWCASES.length + ')'
        await paint()

        var built = s.build(), circuit = built.c
        // Width alone cannot explain these rows: Shor at 27 qubits is 37,033 gates
        // and a 50,000-qubit GHZ chain is 50,000. Depth is what makes the small
        // circuits hard, so it has to be on screen.
        row.gates.textContent = circuit.gateCounts().total.toLocaleString()
        var opts = {}
        for (var bk in BUDGET) opts[bk] = BUDGET[bk]
        for (var k in built.o) opts[k] = built.o[k]

        var t0 = performance.now()
        var report = ket.analyzeHardness(circuit, opts)
        total += performance.now() - t0

        var ok = report.attacks.filter(function (a) { return a.viable && answersIt(a, s.answers) })
        var b = ok.length ? ok[0] : null

        row.tr.className = ''
        row.method.innerHTML = ''
        var got = b ? b.name : null
        var closest = null
        if (!b) {
          for (var ai = 0; ai < report.attacks.length; ai++) {
            var cand = report.attacks[ai]
            if (!cand.applicable || !answersIt(cand, s.answers)) continue
            // A floor's cost is what the *cap* cost, not what the attack costs —
            // mps pinned at χ=4 reports 0.0 h, which as a "closest" reads as a
            // contradiction. Only a believable figure can be quoted here.
            if (cand.parameter && cand.parameter.bound === 'lower') continue
            if (!closest || cand.seconds < closest.seconds) closest = cand
          }
        }
        // Mark what was computed when it is *not* the whole distribution. Dropping
        // the `answers` column made "288 PB vs 66 KB" read as two routes to the
        // same result, when the second is one amplitude and the first is all 2^n.
        var scope = b && b.answers === 'amplitude' ? 'one amplitude, '
                  : b && b.answers === 'expectation' ? 'one expectation, ' : ''
        // An approximate win is not a win until it says so. stabilizer-rank carries a
        // 10% error budget by default, and presented bare it reads as exact.
        var err = b && b.error && b.error.value > 0
          ? ', to within ' + b.error.value : ''
        row.method.textContent = b
          ? b.name + ' - ' + scope + b.parameter.name + ' ' + b.parameter.value + err
          // No "nothing was enough" preamble: the row is red, its memory cell is a
          // dash, and "needs 279 years" is not mistakable for a win.
          : closest
            ? closest.name + ' needs ' + duration(closest.seconds)
            : 'nothing was enough'
        // A mismatch is not quietly relabelled as the expected result.
        row.method.className = got !== s.expect ? 'surprise' : (b ? 'g' : 'r')
        if (got !== s.expect) {
          row.method.textContent += '  (expected ' + (s.expect === null ? 'nothing' : s.expect) + ')'
        }
        if (i === 0 && b) headline = { n: s.n, mem: b.memoryBytes, name: b.name }
        row.needed.textContent = b ? bytes(b.memoryBytes) : '—'
        row.needed.className = b ? 'n g' : 'n r'
        await paint()
      }

      lbl.innerHTML =
        '<span class="live">Nothing here is precomputed. This is ket itself, ' +
        'running in your browser.</span><br>' +
        '<span class="stats">' + SHOWCASES.length + ' circuits - ' +
        ket.ATTACK_NAMES.length + ' attacks each - ' + (total / 1000).toFixed(1) +
        ' s - budget ' + bytes(BUDGET.memoryBytes) + ' / ' +
        (BUDGET.seconds / 3600) + ' hour</span>'
    } catch (e) {
      lbl.textContent = 'failed: ' + (e && e.message ? e.message : String(e))
      throw e
    }
  })()
})()
</script>
</body>
</html>
